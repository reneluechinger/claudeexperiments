<style>

<script>

'use strict';
// ---------- Grundlagen ----------

// ---------- Datum ----------
function parseDue(s) { if (!s) return null; const [d, t = '00:00'] = s.split('T'); const [y, m, dd] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return new Date(y, m - 1, dd, h, mi); }
function fmtDue(s) {
  const d = parseDue(s); if (!d) return '';
  const t = s.split('T')[1]; const showT = t && t !== '00:00';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.${sameYear ? '' : d.getFullYear()}${showT ? ' ' + t : ''}`;
}
function dueState(c) {

  if (c.done) return 'done';
  const d = parseDue(c.due); const t = c.due.split('T')[1];
  const end = (!t || t === '00:00') ? new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23, 59) : d;
  const diff = (end - new Date()) / 864e5;

}

// Kleines Markdown für Beschreibungen
function inlineMd(s) {
  return s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, p, u) => `${p}<a href="${u}" target="_blank" rel="noopener">${u.length > 60 ? u.slice(0, 57) + '…' : u}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, '$1<em>$2</em>');
}
function md(src) {
  const lines = esc(src).split('\n'); let out = '', list = null, para = [];
  const flushP = () => { if (para.length) { out += `<p>${para.map(inlineMd).join('<br>')}</p>`; para = []; } };
  const flushL = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const ln of lines) {

    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { flushP(); if (list !== 'ul') { flushL(); out += '<ul>'; list = 'ul'; } out += `<li>${inlineMd(m[1])}</li>`; }
    else if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if (list !== 'ol') { flushL(); out += '<ol>'; list = 'ol'; } out += `<li>${inlineMd(m[1])}</li>`; }

    else if (!ln.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(ln); }
  }

}

// ---------- Zustand ----------
let db = null, mcp = null, perms = null;
const boards = new Map();     // id -> board data

const board = () => boards.get(activeId);
const listOf = (b, id) => (b?.lists || []).find((l) => l.id === id);

// Schreibvorgänge pro Dokument nacheinander ausführen
const chains = new Map();
function queue(path, fn) {

  chains.set(path, p); return p;
}
let pending = 0;
function setSync(t) { $('#sync').textContent = t; }
function track(p) { pending++; setSync('Speichert …'); return p.finally(() => { if (--pending === 0) setSync('Gespeichert'); }); }
const clone = (o) => JSON.parse(JSON.stringify(o));

function writeCard(id, patch) {
  patch.updatedAt = nowIso();
  const c = cards.get(id); if (c) cards.set(id, { ...c, ...patch });
  return track(queue('cards/' + id, () => db.doc('cards/' + id).update(patch)));
}

  return track(queue('cards/' + id, () => db.doc('cards/' + id).set(data)));
}
function removeCard(id) { cards.delete(id); return track(queue('cards/' + id, () => db.doc('cards/' + id).delete())); }
function writeBoard(id, patch) {
  const b = boards.get(id); if (b) boards.set(id, { ...b, ...patch });
  return track(queue('boards/' + id, () => db.doc('boards/' + id).update(patch)));
}

// ---------- Automationen ----------
function cardsIn(listId) { return [...cards.values()].filter((c) => c.list === listId); }
function topPos(listId) { const ps = cardsIn(listId).map((c) => c.pos || 0); return ps.length ? Math.min(...ps) - 1024 : 1024; }
function endPos(listId) { const ps = cardsIn(listId).map((c) => c.pos || 0); return ps.length ? Math.max(...ps) + 1024 : 1024; }

  const r = (b && b.rules) || {}; const out = { ...patch }; const notes = [];

    out.doneAt = nowIso();
    if (r.checkMovesToDone && r.doneList && next.list !== r.doneList && !('list' in patch)) { out.list = r.doneList; out.pos = topPos(r.doneList); notes.push('nach «' + (listOf(b, r.doneList)?.name || 'Erledigt') + '» verschoben'); }
  }

    out.list = r.dueList; out.pos = topPos(r.dueList); notes.push('wegen Datum nach «' + (listOf(b, r.dueList)?.name || 'Terminiert') + '» verschoben');

  }

}
function applyCard(id, patch) {
  const c = cards.get(id); if (!c) return;
  const { patch: p, notes } = withRules(c, patch);
  writeCard(id, p);
  if (notes.length) toast('Automatik: ' + notes.join(', '), false);
  render();
}

async function autoArchive(b) {
  const r = b.rules || {};
  if (!r.doneList || !(r.archiveAfterDays > 0)) return 0;
  const limit = Date.now() - r.archiveAfterDays * 864e5; let n = 0;
  for (const [id, c] of cards) {
    if (c.list === r.doneList && c.done && c.doneAt && Date.parse(c.doneAt) < limit) { writeCard(id, { archived: true, archivedAt: nowIso() }); cards.delete(id); n++; }
  }
  if (n) { render(); toast(`Automatik: ${n} erledigte Karte${n > 1 ? 'n' : ''} archiviert`, false); }
  return n;
}

// Wiederkehrende Karten
function lastOccurrence(def, today) {
  const r = def.rule || {}; const start = def.start ? parseDue(def.start) : null;
  for (let i = 0; i < 400; i++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
    if (start && d < start) return null;
    const key = ymd(d);
    if (def.lastCreated && key <= def.lastCreated) return null;
    let hit = false;
    if (r.type === 'weekly') hit = (r.days || []).includes(d.getDay());
    else if (r.type === 'monthly') { const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); hit = d.getDate() === Math.min(r.day || 1, last); }
    else if (r.type === 'interval') { const base = start || new Date(2026, 0, 1); const diff = Math.round((d - base) / 864e5); hit = diff >= 0 && diff % Math.max(1, (r.every || 1) * (r.unit === 'weeks' ? 7 : 1)) === 0; }
    if (hit) return d;
  }
  return null;
}
function fillTitle(t, d) { return t.replace(/\{datum\}/gi, `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth() + 1}.`); }
async function runRecurring(manualId) {
  const today = new Date(); let made = 0;
  for (const [id, def] of recurring) {
    if (manualId ? id !== manualId : def.active === false) continue;
    const d = manualId ? today : lastOccurrence(def, today);
    if (!d) continue;
    const key = ymd(d); const cid = `rec-${id}-${key}`;
    const exists = cards.has(cid) || (await db.doc('cards/' + cid).get()).exists;
    if (!exists) {
      const b = boards.get(def.board); if (!b) continue;
      const list = listOf(b, def.list) ? def.list : b.lists[0]?.id;
      const items = (def.checklist || '').split('\n').map((s) => s.trim()).filter(Boolean);
      await createCard(cid, {
        board: def.board, list, pos: def.board === activeId ? topPos(list) : -Date.now(),
        title: fillTitle(def.title, d), desc: def.desc || '', labels: def.labels || [],
        due: def.withDue ? `${key}T${def.time || '00:00'}` : '', done: false, doneAt: '',
        checklists: items.length ? [{ id: 'c0', name: 'Checkliste', items: items.map((t, i) => ({ id: 'i' + i, text: t, done: false })) }] : [],
        cover: '', archived: false, source: 'recurring', recurringId: id,
      });
      made++;
    }
    if (!def.lastCreated || key > def.lastCreated) { recurring.set(id, { ...def, lastCreated: key }); await track(queue('recurring/' + id, () => db.doc('recurring/' + id).update({ lastCreated: key }))); }
  }
  if (made) { render(); toast(`Automatik: ${made} wiederkehrende Karte${made > 1 ? 'n' : ''} erstellt`, false); }
  return made;
}

// ---------- Capture über Gmail ----------
let capBusy = false;
function parseCapture(text, b) {
  let title = text; let due = ''; const labels = [];
  title = title.replace(/(^|\s)#([\p{L}\d_-]+)/gu, (m, sp, tag) => {
    const l = (b.labels || []).find((x) => x.name.toLowerCase().startsWith(tag.toLowerCase()));
    if (l) { if (!labels.includes(l.id)) labels.push(l.id); return sp; } return m;
  });
  title = title.replace(/(^|\s)@(heute|morgen|übermorgen|mo|di|mi|do|fr|sa|so|\d{1,2}\.\d{1,2}\.?(?:\d{2,4})?)(?:\s+(\d{1,2})[:.](\d{2}))?(?=\s|$)/i, (m, sp, w, h, mi) => {
    const t = new Date(); t.setHours(0, 0, 0, 0); let d = null; const k = w.toLowerCase();
    if (k === 'heute') d = t; else if (k === 'morgen') d = new Date(t.getTime() + 864e5); else if (k === 'übermorgen') d = new Date(t.getTime() + 2 * 864e5);
    else if (WD.map((x) => x.toLowerCase()).includes(k)) { const target = WD.map((x) => x.toLowerCase()).indexOf(k); let add = (target - t.getDay() + 7) % 7 || 7; d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + add); }
    else { const [dd, mm, yy] = k.split('.').filter(Boolean).map(Number); let y = yy ? (yy < 100 ? 2000 + yy : yy) : t.getFullYear(); d = new Date(y, mm - 1, dd); if (!yy && d < t) d = new Date(y + 1, mm - 1, dd); }
    due = `${ymd(d)}T${h ? pad(+h) + ':' + mi : '00:00'}`; return sp;
  });
  return { title: title.replace(/\s+/g, ' ').trim() || text.trim(), due, labels };
}
function mcpMessage(e) {
  const c = e?.code;
  if (c === 'server_not_connected') return 'Gmail ist nicht verbunden. Verbinde Gmail in claude.ai unter Einstellungen → Connectors.';
  if (c === 'needs_reauth') return 'Gmail muss neu verbunden werden: claude.ai → Einstellungen → Connectors.';
  if (c === 'not_in_manifest') return 'Der Gmail-Zugriff ist für diese Seite ausgeschaltet. Erlaube ihn über das Berechtigungs-Menü der Seite.';
  if (c === 'approval_required') return 'Der Gmail-Zugriff braucht deine Bestätigung. Tippe nochmals auf Capture.';
  if (c === 'selection_required') return 'Du hast mehrere Gmail-Konten verbunden. Wähle eines in der Abfrage von claude.ai.';
  if (c === 'blocked_by_policy') return 'Gmail ist für dieses Konto gesperrt.';
  if (c === 'server_unavailable') return 'Gmail antwortet gerade nicht. Versuch es in einer Minute nochmals.';
  return 'Capture fehlgeschlagen: ' + (e?.message || c || 'unbekannter Fehler');
}
async function fetchCaptures(manual) {
  if (capBusy) return; if (!mcp) { if (manual) toast('Capture braucht den Gmail-Zugriff, der in dieser Ansicht nicht verfügbar ist.', false); return; }
  const capBoard = boards.get(settings.captureBoard) || board(); if (!capBoard) return;
  const capList = listOf(capBoard, settings.captureList) ? settings.captureList : capBoard.lists[0]?.id;
  capBusy = true; $('#captureBtn').classList.add('on'); setSync('Prüfe Capture-Mails …');
  let n = 0;
  try {
    const labelName = settings.gmailLabel || 'Pinnwand/erfasst';
    const q = `subject:"[Capture]" -label:${labelName.replace(/[\/\s]/g, '-')} newer_than:90d`;
    const res = await mcp.callTool('Gmail', 'search_threads', { query: q, pageSize: 25 }, { cache: false });
    const threads = res.payload?.threads || [];
    let labelId = settings.gmailLabelId;
    for (const t of threads) {
      for (const m of t.messages || []) {
        if (!/\[capture\]/i.test(m.subject || '')) continue;
        if (labelId && (m.labelIds || []).includes(labelId)) continue;
        const cid = 'cap-' + m.id;
        const exists = cards.has(cid) || (await db.doc('cards/' + cid).get()).exists;
        if (!exists) {
          const raw = (m.subject || '').replace(/\[capture\]\s*:?/i, '').trim();
          const p = parseCapture(raw, capBoard);
          let data = { board: capBoard.id, list: capList, pos: capBoard.id === activeId ? topPos(capList) : -Date.now(), title: p.title, desc: (m.snippet || '').trim(), labels: p.labels, due: '', done: false, doneAt: '', checklists: [], cover: '', archived: false, source: 'capture', mailUrl: m.viewUrl || '' };
          if (p.due) { const { patch } = withRules(data, { due: p.due }, capBoard); data = { ...data, ...patch }; }
          await createCard(cid, data); n++;
        }
        try { await mcp.callTool('Gmail', 'label_message', { messageId: m.id, labelIds: [labelId || 'Label_28'] }); }
        catch (e) {
          if (e?.code === 'tool_error') {
            const ls = await mcp.callTool('Gmail', 'list_labels', {}, { cache: false });
            const found = (ls.payload?.labels || []).find((l) => (l.name || l.displayName) === labelName);
            if (found) { labelId = found.id || found.labelId; settings.gmailLabelId = labelId; db.doc('meta/settings').update({ gmailLabelId: labelId }); await mcp.callTool('Gmail', 'label_message', { messageId: m.id, labelIds: [labelId] }); }
          } else throw e;
        }
      }
    }
    if (n) { render(); toast(`${n} neue Capture-Karte${n > 1 ? 'n' : ''} in «${listOf(capBoard, capList)?.name}»`, false); }
    else if (manual) toast('Keine neuen Capture-Mails', false);
    setSync('Gespeichert');
  } catch (e) { setSync('Capture nicht möglich'); toast(mcpMessage(e), false); }
  finally { capBusy = false; $('#captureBtn').classList.remove('on'); }
}
$('#captureBtn').addEventListener('click', () => fetchCaptures(true));

// ---------- Darstellung ----------
const listsEl = $('#lists');
let composerOpen = null, addListOpen = false, dragging = false, renderQueued = false;
function matches(c) {
  if (filter.q && !(c.title + ' ' + (c.desc || '')).toLowerCase().includes(filter.q)) return false;
  if (filter.labels.size && !(c.labels || []).some((l) => filter.labels.has(l))) return false;
  return true;
}
function sortCards(list, arr) {
  if (list.sort === 'due') return arr.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.pos || 0) - (b.pos || 0));
  return arr.sort((a, b) => (a.pos || 0) - (b.pos || 0));
}
function cardHTML(id, c, b) {
  const ds = dueState(c);
  const items = (c.checklists || []).flatMap((x) => x.items || []);
  const total = items.length, okN = items.filter((i) => i.done).length;
  const chips = (c.labels || []).map((l) => (b.labels || []).find((x) => x.id === l)).filter(Boolean).map((l) => `<span class="chip bg-${l.color} ${l.color}">${esc(l.name)}</span>`).join('');

function editListTitle(h, list) {

  if (id) $('#rDel', f).onclick = () => { recurring.delete(id); track(queue('recurring/' + id, () => db.doc('recurring/' + id).delete())); openRecurring(); toast('Gelöscht', false); };
}

      <li>Beispiel: <span class="mono">[Capture] Elternbrief Klausaktion #schule @fr 07:30</span></li>

    <div class="row"><button class="btn" id="capNow">Jetzt Capture-Mails abholen</button></div></div>`, (el) => { $('#capNow', el).onclick = () => { panelDlg.close(); fetchCaptures(true); }; });
}

function openLabels() {
  const b = board();
  openPanel(`<div class="panel"><h2>Labels von «${esc(b.name)}»</h2><section id="lblList">${(b.labels || []).map((l) => `<div class="row" data-l="${l.id}"><select class="field" data-lc aria-label="Farbe">${COLORS.map((c) => `<option value="${c}"${c === l.color ? ' selected' : ''}>${c}</option>`).join('')}</select><input class="field" style="flex:1;min-width:8rem" data-ln value="${esc(l.name)}" aria-label="Name"><button class="icon-btn" data-ldel aria-label="Label löschen">${ICON.trash}</button></div>`).join('')}</section>
    <div class="row"><button class="btn ghost" id="lAdd">+ Label</button><button class="btn" id="lSave">Speichern</button></div></div>`, (el) => {
    $('#lAdd', el).onclick = () => { $('#lblList', el).insertAdjacentHTML('beforeend', `<div class="row" data-l="${uid('lb-')}"><select class="field" data-lc>${COLORS.map((c) => `<option>${c}</option>`).join('')}</select><input class="field" style="flex:1;min-width:8rem" data-ln placeholder="Name"><button class="icon-btn" data-ldel aria-label="Label löschen">${ICON.trash}</button></div>`); };
    el.addEventListener('click', (e) => { if (e.target.closest('[data-ldel]')) e.target.closest('[data-l]').remove(); });
    $('#lSave', el).onclick = () => { const labels = [...el.querySelectorAll('[data-l]')].map((r) => ({ id: r.dataset.l, color: $('[data-lc]', r).value, name: $('[data-ln]', r).value.trim() })).filter((l) => l.name); writeBoard(b.id, { labels }); panelDlg.close(); render(); toast('Labels gespeichert', false); };
  });
}

async function openArchive() {
  const b = board();
  openPanel(`<div class="panel"><h2>Archiv von «${esc(b.name)}»</h2><section id="archList"><p>Lade archivierte Karten …</p></section></div>`);
  try {
    const snap = await db.collection('cards').where('board', '==', b.id).where('archived', '==', true).limit(300).get();
    const docs = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((x, y) => (y.archivedAt || y.updatedAt || '').localeCompare(x.archivedAt || x.updatedAt || ''));
    $('#archList', panelBody).innerHTML = docs.length ? docs.map((c) => `<div class="arch-item"><span>${esc(c.title)} <span class="hint">· ${esc(listOf(b, c.list)?.name || '')}</span></span><span class="row"><button class="btn ghost" data-a="restore:${c.id}">Wiederherstellen</button><button class="icon-btn" data-a="del:${c.id}" aria-label="Endgültig löschen">${ICON.trash}</button></span></div>`).join('') : '<p>Keine archivierten Karten.</p>';
    $('#archList', panelBody).onclick = (e) => {
      const t = e.target.closest('[data-a]'); if (!t) return; const [a, id] = t.dataset.a.split(':'); const c = docs.find((x) => x.id === id);
      if (a === 'restore') { const lst = listOf(b, c.list) ? c.list : b.lists[0].id; const patch = { archived: false, list: lst, pos: topPos(lst) }; if (b.rules?.doneList === lst) patch.doneAt = nowIso(); cards.set(id, { ...c, ...patch }); writeCard(id, patch); render(); }
      else removeCard(id);
      t.closest('.arch-item').remove();
    };
  } catch (e) { $('#archList', panelBody).innerHTML = `<p>Archiv konnte nicht geladen werden (${esc(e?.code || e?.message)}).</p>`; }
}
function openDeleteBoard() {
  const b = board();
  openPanel(`<div class="panel"><h2>Board «${esc(b.name)}» löschen?</h2><p>Das Board verschwindet aus der Übersicht. Die Karten bleiben in der Datenbank, werden aber nicht mehr angezeigt. Tippe zur Bestätigung den Namen des Boards ein.</p>
    <input class="field" id="delName" aria-label="Name des Boards"><div class="row"><button class="btn danger" id="delGo" disabled>Board löschen</button></div></div>`, (el) => {
    $('#delName', el).oninput = (e) => { $('#delGo', el).disabled = e.target.value.trim() !== b.name; };
    $('#delGo', el).onclick = () => { boards.delete(b.id); track(queue('boards/' + b.id, () => db.doc('boards/' + b.id).delete())); panelDlg.close(); const first = orderedBoards()[0]; if (first) switchBoard(first[0]); toast('Board gelöscht', false); };
  });
}

// ---------- Datenbank ----------
function showState(title, text) { listsEl.innerHTML = `<div class="state"><h2>${esc(title)}</h2><p>${text}</p></div>`; }
function subscribeCards() {
  if (unsubCards) unsubCards(); cards.clear(); render();
  if (!board()) return;
  const bid = activeId;
  unsubCards = db.collection('cards').where('board', '==', bid).where('archived', '==', false).limit(1000).onSnapshot((snap) => {
    if (bid !== activeId) return;
    for (const ch of snap.docChanges()) {
      if (ch.type === 'removed') cards.delete(ch.doc.id); else cards.set(ch.doc.id, ch.doc.data());
    }
    if (!snap.metadata.hasPendingWrites && !pending) setSync(snap.metadata.fromCache ? 'Lädt …' : 'Aktuell');
    render();
    if (openId && dlg.open && !dlgBody.contains(document.activeElement) && !textTimers.size && !editingDesc) renderCard();
    if (!snap.metadata.fromCache && !autoRan.has(bid)) { autoRan.add(bid); autoArchive(board()); }
  }, (e) => { showState('Karten konnten nicht geladen werden', esc(e?.message || e?.code)); });
}
async function boot() {
  db = await claude.use('db');
  if (!db) { showState('Datenbank nicht erreichbar', 'Öffne die Pinnwand angemeldet auf claude.ai. Nur dort sind deine Boards gespeichert.'); setSync('offline'); return; }
  db.doc('meta/settings').onSnapshot((s) => { settings = s.exists ? { ...s.data() } : {}; if (!booted && boards.size) start(); });
  db.collection('boards').onSnapshot((snap) => {
    for (const ch of snap.docChanges()) { if (ch.type === 'removed') boards.delete(ch.doc.id); else boards.set(ch.doc.id, { ...ch.doc.data(), id: ch.doc.id }); }
    if (!boards.size && !snap.metadata.fromCache) { showState('Noch keine Boards', 'Die Daten aus Trello werden gerade importiert. Lade die Seite in ein paar Minuten neu.'); return; }
    if (!booted) start(); else render();
  }, (e) => showState('Boards konnten nicht geladen werden', esc(e?.message || e?.code)));
  db.collection('recurring').onSnapshot((snap) => { for (const ch of snap.docChanges()) { if (ch.type === 'removed') recurring.delete(ch.doc.id); else recurring.set(ch.doc.id, ch.doc.data()); } }, () => {});
  claude.use('mcp').then((m) => { mcp = m; });
  claude.use('permissions').then((p) => { perms = p; });
}
let startedAuto = false;
function start() {
  if (booted || !boards.size) return; booted = true;
  if (!boards.has(activeId)) activeId = (settings.boardOrder || []).find((id) => boards.has(id)) || orderedBoards()[0][0];
  subscribeCards();
  // Automatik nach dem ersten Laden: wiederkehrende Karten, Capture (nur wenn Gmail schon erlaubt ist)
  setTimeout(async () => {
    if (startedAuto) return; startedAuto = true;
    try { await runRecurring(); } catch (e) { console.error(e); }
    const m = await claude.use('mcp'); mcp = m;
    if (!m) return;
    let st = 'prompt';
    try { const p = await claude.use('permissions'); st = p ? await p.state('mcp:Gmail').catch(() => 'unavailable') : 'prompt'; } catch (e) {}
    if (st === 'granted') fetchCaptures(false);
    else if (st !== 'denied' && st !== 'unavailable') { $('#capN').hidden = false; $('#capN').textContent = '?'; $('#captureBtn').title = 'Tippen, um Capture-Mails abzuholen (fragt einmal nach Gmail-Zugriff)'; }
  }, 1500);
}
$('#captureBtn').addEventListener('click', () => { $('#capN').hidden = true; });
if (window.claude && claude.use) boot(); else showState('Nur auf claude.ai verfügbar', 'Diese Pinnwand speichert ihre Daten in claude.ai. Öffne sie über den Artifact-Link.');
})();
</script>
